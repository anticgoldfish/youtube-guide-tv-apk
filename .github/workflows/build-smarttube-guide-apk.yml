name: Build YouTube Guide — SmartTube Fork APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out YouTube Guide overlay
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android toolchain
        uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK and NDK dependencies
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager 'platforms;android-34' 'build-tools;30.0.3' 'ndk;21.0.6113669'
      - name: Clone SmartTube playback source and dependencies
        run: |
          git clone --recursive https://github.com/yuliskov/SmartTube.git SmartTube
          cd SmartTube
          git checkout 2bcad2c130f5789af22094a59c029d14461825f0
          git submodule update --init --recursive
      - name: Apply native guide overlay to SmartTube
        run: python3 apply_overlay.py SmartTube
      - name: Compile SmartTube-based guide APK
        working-directory: SmartTube
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStstableDebug
      - name: Upload one-file Google TV APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Guide-SmartTube-Fork-APK
          path: SmartTube/smarttubetv/build/outputs/apk/ststable/debug/*.apk
          if-no-files-found: error
